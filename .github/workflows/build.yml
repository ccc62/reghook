name: Build RegHook v5 ARM64
on:
  workflow_dispatch:
  push:
    paths:
      - 'RegHook-v5/**'
      - '.github/workflows/build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Compile ARM64 binary
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            -std=c11 -O2 -Wall -Wextra -Wno-misleading-indentation \
            RegHook-v5/reg_hook.c -o build/reghook-arm64
          file build/reghook-arm64
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp build/reghook-arm64 dist/
          cp RegHook-v5/README_CN.md dist/
          cp RegHook-v5/reg_hook.c dist/
          sha256sum dist/reghook-arm64 > dist/SHA256SUMS
          cd dist && zip -r ../RegHook-v5-ARM64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: RegHook-v5-ARM64
          path: |
            build/reghook-arm64
            dist/RegHook-v5-ARM64.zip
